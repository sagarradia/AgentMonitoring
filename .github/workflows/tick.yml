# Calls the site every 15 minutes so rests end on time and GitHub ticket status refreshes,
# even when nobody has the page open. Needs two repository secrets: APP_URL and CRON_SECRET.
name: tick
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.TICK_ON != 'no' }}
    steps:
      - name: Call the site
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET secret is not set yet; nothing to do."; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/feed/cron"
