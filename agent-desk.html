<title>Agent Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: project rail on the left; workspace on the right is a spreadsheet-style tree grid (agent rows expand into goal, KRA, KPI and todo rows, then their reports).
   Profile and chat slide in from the right; the build-an-agent wizard is a centred dialog. */
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--surface2:#E9EDF2;--line:#D5DBE3;--fg:#131C28;--muted:#586577;
  --accent:#2D54D1;--accent-soft:#E4EAFB;--on-accent:#FFFFFF;
  --ok:#2B8458;--warn:#A86A12;--bad:#BE3A2A;--ok-soft:#E1F2E9;--warn-soft:#F7ECD8;--bad-soft:#F8E3DF;
  --row-sub:#F7F9FC;--row-hot:#FDF1EF;
  --shadow:0 12px 40px rgba(19,28,40,.18);--scrim:rgba(19,28,40,.45);
  --display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A;--surface:#151C25;--surface2:#1D2631;--line:#2B3644;--fg:#E7ECF2;--muted:#95A2B3;
  --accent:#86A2FF;--accent-soft:#1F2B52;--on-accent:#0E131A;
  --ok:#5FC28B;--warn:#E2B45F;--bad:#F18A7B;--ok-soft:#173326;--warn-soft:#35290F;--bad-soft:#3A1D19;
  --row-sub:#121A23;--row-hot:#2B1917;
  --shadow:0 12px 40px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A;--surface:#151C25;--surface2:#1D2631;--line:#2B3644;--fg:#E7ECF2;--muted:#95A2B3;
  --accent:#86A2FF;--accent-soft:#1F2B52;--on-accent:#0E131A;
  --ok:#5FC28B;--warn:#E2B45F;--bad:#F18A7B;--ok-soft:#173326;--warn-soft:#35290F;--bad-soft:#3A1D19;
  --row-sub:#121A23;--row-hot:#2B1917;
  --shadow:0 12px 40px rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding-inline:16px;padding-block:20px 48px}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono)}
.bad{color:var(--bad)}
.hint{color:var(--muted);font-size:12.5px}

.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;max-width:1500px;margin:0 auto}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}

/* rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;display:flex;flex-direction:column;gap:14px;min-width:0}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand small{display:block;font:400 12px var(--sans);color:var(--muted);letter-spacing:0;margin-top:2px}
.scopes{display:flex;flex-direction:column;gap:4px}
.scope{display:flex;flex-direction:column;gap:1px;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px;min-width:0}
.scope:hover{background:var(--surface2)}
.scope[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.scope b{font-weight:600;overflow-wrap:anywhere}
.scope span{font:400 11.5px var(--mono);color:var(--muted)}
.rail-foot{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
textarea,input[type=text],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%}
textarea{resize:vertical;min-height:72px;line-height:1.45}
select{width:auto}

/* header */
.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
.top .sub{margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:1px 9px;font:500 11.5px var(--mono);background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag{font:500 11px var(--mono);border:1px dashed var(--muted);color:var(--muted);border-radius:4px;padding:0 6px;white-space:nowrap}
.cnt{font:400 11px var(--mono);color:var(--muted);white-space:nowrap}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.brief label{font-weight:600}
.brief .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px}
.strip>div{padding:10px 16px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);min-width:0}
.strip>div:first-child{border-left:0}
.strip .l{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.strip .v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.strip .v small{font:400 13px var(--sans);color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 11px;font-weight:500;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab em{font:500 11px var(--mono);font-style:normal;background:var(--surface2);border-radius:99px;padding:0 7px;margin-left:6px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=text]{flex:1;min-width:180px;width:auto}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h3{font-family:var(--display);font-size:20px}
.empty p{color:var(--muted);max-width:60ch}

/* spreadsheet grid */
.sheetwrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-height:72vh}
table.sheet{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;font-size:13px}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 8px;height:32px;vertical-align:middle;white-space:nowrap;text-align:left}
.sheet thead th{position:sticky;top:0;z-index:2;background:var(--surface2);font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sheet .rn{width:46px;min-width:46px;text-align:right;background:var(--surface2);color:var(--muted);font:400 11px var(--mono);position:sticky;left:0;z-index:1}
.sheet thead .rn{z-index:3}
.sheet td.name{white-space:normal;min-width:300px}
.sheet td.detail{white-space:normal;min-width:200px;max-width:340px;color:var(--muted)}
.sheet td.kind{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sheet td.act{white-space:nowrap;display:table-cell}
.sheet td.act .btn+.btn{margin-left:4px}
.sheet td.proj{font:400 12px var(--mono);color:var(--muted)}
.sheet tr.r-agent td:not(.rn){background:var(--surface)}
.sheet tr.r-agent td.name{font-weight:600}
.sheet tr.r-sub td:not(.rn){background:var(--row-sub)}
.sheet tr.hot td:not(.rn){background:var(--row-hot)}
.sheet tr:hover td:not(.rn){filter:brightness(.98)}
.sheet td.t-ok{color:var(--ok)}.sheet td.t-warn{color:var(--warn)}.sheet td.t-bad{color:var(--bad)}
.caret{width:22px;height:22px;border:0;background:none;color:var(--muted);padding:0;vertical-align:middle}
.nm{background:none;border:0;padding:0 2px;font-weight:600;text-align:left;vertical-align:middle}
.nm:hover{text-decoration:underline}
.cell{border:1px solid transparent;background:transparent;border-radius:3px;padding:3px 4px;height:26px;width:100%}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--accent);background:var(--surface)}
select.cell{width:auto;min-width:86px}
input.dt{width:132px;font-family:var(--mono);font-size:12px}
input.num{width:64px;text-align:right;font-family:var(--mono)}
.sheet label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.sheet label input{margin-top:3px}
.sheet tr.add input{width:100%}
.sheet .btn.small{padding:2px 9px}
.sheet td.blocked{color:var(--warn)}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.panel-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.panel-head h2{font-family:var(--display);font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.panel-head .role{color:var(--muted)}
.panel-head .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.panel-body{overflow-y:auto;padding:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;min-width:0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h3{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sec ul.plain{display:flex;flex-direction:column;gap:5px}
.sec ul.plain li{padding-left:14px;position:relative;overflow-wrap:anywhere}
.sec ul.plain li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts span{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.facts b{font-weight:500;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface2);border-radius:6px;padding:2px 8px;font-size:12.5px}
.rowline{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.rowline .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.rowline small{display:block;color:var(--muted);font:400 11.5px var(--mono)}
.rowline.done .grow{color:var(--muted);text-decoration:line-through}
.rowline .dt{margin-top:2px}
.kin{width:84px;text-align:right;font-family:var(--mono)}
.kpi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.kpi .bar{grid-column:1/-1}
.kpi .tg{font:400 12px var(--mono);color:var(--muted);text-align:right}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.t-ok .bar i{background:var(--ok)}.t-warn .bar i{background:var(--warn)}.t-bad .bar i{background:var(--bad)}
.st{border:1px solid var(--line);background:var(--surface);border-radius:99px;width:24px;height:24px;flex:none;display:grid;place-items:center;font:500 11px var(--mono);padding:0}
.st[data-s="doing"]{border-color:var(--accent);color:var(--accent)}
.st[data-s="done"]{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.addrow{display:flex;gap:8px}
.foot{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* chat */
.panel.chat{width:min(620px,100%)}
.chat-note{padding:8px 16px;font-size:12.5px;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--line)}
.chat-quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.chat-log{flex:1;min-height:120px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;gap:2px;max-width:94%}
.msg.founder{align-self:flex-end}
.msg .who{font:500 11px var(--mono);color:var(--muted)}
.msg.founder .who{text-align:right}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line)}
.msg.founder .txt{background:var(--accent-soft);border-color:var(--accent)}
.props{border-top:1px solid var(--line);padding:10px 16px;max-height:34%;overflow-y:auto;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.props h3{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.prop{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.prop .grow{min-width:0;overflow-wrap:anywhere;font-size:13px}
.prop .grow small{display:block;color:var(--muted);font:400 11.5px var(--mono)}
.chat-compose{border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);display:flex;flex-direction:column;gap:8px}
.chat-compose textarea{min-height:56px}
.chat-compose .row{display:flex;gap:8px;flex-wrap:wrap}

.modal{position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:12px 12px 0 0}
.modal-head h2{font-family:var(--display);font-size:22px}
.modal-head p{color:var(--muted);margin-top:2px}
.modal-body{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface);border-radius:0 0 12px 12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-weight:600}
.fld .hint{font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.note{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:13px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13px}
.steps{display:flex;gap:8px;font:500 11.5px var(--mono);color:var(--muted);margin-top:8px}
.steps b{color:var(--fg)}
.block{display:flex;flex-direction:column;gap:8px}
.block h2{font-family:var(--display);font-size:19px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:40;font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static}
  .scopes{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .scope{min-width:150px;border-color:var(--line);background:var(--surface)}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip>div:nth-child(3){border-left:0}
  .strip>div:nth-child(n+3){border-top:1px solid var(--line)}
  .top h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.ov{display:flex;flex-direction:column;gap:20px}
.ov-hero{background:var(--bad-soft);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.ov-hero.ok{background:var(--ok-soft)}
.ov-hero h2{font-family:var(--display);font-size:26px;line-height:1.2}
.ov-hero p{font-size:15px;max-width:70ch}
.ov-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ov-tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.ov-tile b{font:600 30px/1.1 var(--display)}
.ov-tile span{color:var(--muted);font-size:13px}
.ov h3{font-family:var(--display);font-size:18px;margin-bottom:8px}
.ov-need{display:flex;flex-direction:column;gap:8px}
.ov-need li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:14.5px}
.ov-need li b{display:block}
.ov-teams{display:flex;flex-direction:column;gap:8px}
.ov-team{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.ov-team .t{font-weight:600}.ov-team .t small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.ov-team .pc{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.pill{border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.mute{background:var(--surface2);color:var(--muted)}
.ov-go{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:760px){.ov-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.ov-team{grid-template-columns:1fr}.ov-hero h2{font-size:22px}}

.stick{position:sticky;left:0;background:var(--surface);z-index:1}
th.stick{background:var(--surface2);z-index:2}
.cl{margin:0;padding:0;list-style:none;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.cl li{padding-left:10px;position:relative}.cl li:before{content:'·';position:absolute;left:0;color:var(--muted)}
.dir-count{color:var(--muted);font-size:12.5px;margin:6px 0}
table.dir{width:max-content;min-width:0}
table.dir th{white-space:nowrap}
table.dir td{vertical-align:top;white-space:normal;height:auto;padding:8px;max-width:340px}
.cl1 li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
table.dir td.name{min-width:200px}
table.dir td:nth-child(n+3):nth-child(-n+7){min-width:100px}
.mdl{font:600 12px var(--mono);padding:2px 8px;border-radius:6px;background:var(--surface2);white-space:nowrap}
.mdl.opus{background:var(--accent-soft);color:var(--accent)}.mdl.sonnet{background:var(--ok-soft);color:var(--ok)}

.mainhead{position:sticky;top:0;z-index:10;background:var(--bg);padding-block:6px 0;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 var(--line)}
.mainhead .top{align-items:center}.mainhead .top h1{font-size:22px}.mainhead .top p{display:none}
.mainhead .tabs{border-bottom:0}
.sheetwrap{max-height:calc(100vh - 150px);min-height:320px}
table.sheet thead th{position:sticky;top:0;z-index:3}
.top .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn.danger{color:var(--bad)}
.fld textarea,.fld input[type=text],.fld select{width:100%}
.fld textarea{min-height:64px;resize:vertical}
table.dir select.cell{min-width:150px}
table.sheet thead th.stick{z-index:6;left:0}
table.sheet td.stick{z-index:2}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg .btn{border:0;border-radius:0;background:none}
.seg .btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pp{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.pp-list{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - 230px);overflow:auto;padding:6px}
.pp-team{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 8px 4px}
.pp-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;color:var(--fg)}
.pp-item:hover{background:var(--surface2)}.pp-item.on{background:var(--accent-soft)}
.pp-item .pn{flex:1;min-width:0;display:flex;flex-direction:column}
.pp-item .pn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-item small{color:var(--muted);font-size:12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 12px var(--mono);flex:none}
.av.lg{width:56px;height:56px;font-size:17px}
.pp-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;max-height:calc(100vh - 230px);overflow:auto;display:flex;flex-direction:column;gap:18px}
.pc-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pc-head .grow{flex:1;min-width:200px}.pc-head h3{font-family:var(--display);font-size:22px;line-height:1.2}
.pc-head .btns{display:flex;gap:6px;flex-wrap:wrap}
.pc-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pc-facts>div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pc-facts>div>span{font:500 11px var(--mono);text-transform:uppercase;color:var(--muted)}
.pc-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.pc-s h4{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.pc-s p{font-size:14px}
@media (max-width:900px){.pp{grid-template-columns:1fr}.pp-list,.pp-card{max-height:none}}

.vrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.gc{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cd.hot{border-left:4px solid var(--bad)}
.cd h3{font-family:var(--display);font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.cd-h{display:flex;gap:10px;align-items:flex-start}.cd-h .grow{flex:1;min-width:0}
.cd .acts{display:flex;gap:6px;flex-wrap:wrap}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--surface2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 290px);overflow:auto}
.kcol>h3{font:600 12px var(--mono);text-transform:uppercase;color:var(--muted);position:sticky;top:-10px;background:var(--surface2);padding:6px 0 4px;margin-top:-6px;z-index:1}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.kc.hot{border-left:4px solid var(--bad)}.kc p{overflow-wrap:anywhere}
.kc .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.guide{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.guide h3{font-family:var(--display);font-size:17px}
.guide ol{list-style:decimal;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.pickbox{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.pickbox label{display:flex;gap:8px;align-items:center;font-weight:400}
.cf{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cf .fld label{font-weight:500;font-size:12px;color:var(--muted)}
.sumrow{display:flex;gap:10px;flex-wrap:wrap}
.sumrow span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
@media (max-width:900px){.kan{grid-template-columns:1fr}.kcol{max-height:none}}

/* ---------- tree ---------- */
function nrm(s){return String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function repKey(s){var t=String(s||''),v=t.toLowerCase().indexOf(' via ');if(v>=0)t=t.slice(v+5);return nrm(t)}
function sortAg(x,y){var rx=x.level==='Head'?0:1,ry=y.level==='Head'?0:1;return rx-ry||String(x.name).localeCompare(String(y.name))}
function buildTree(list){
  var kids={},roots=[],names=list.map(function(a){var n=nrm(a.name);return {a:a,n:n,w:n.split(' ')}});
  list.forEach(function(a){
    var rk=repKey(a.reportsTo),parent=null;
    if(rk&&rk!=='founder'){
      var same=names.filter(function(x){return x.a.id!==a.id&&x.a.projectId===a.projectId});
      var ex=same.filter(function(x){return x.n===rk})[0];
      if(!ex){var rw=rk.split(' '),c=same.filter(function(x){return rw.every(function(w){return x.w.indexOf(w)>=0})});c.sort(function(p,q){return p.w.length-q.w.length});ex=c[0]}
      if(ex)parent=ex.a.id;
    }
    if(parent)(kids[parent]=kids[parent]||[]).push(a);else roots.push(a);
  });
  var seen={};
  function mark(a){if(seen[a.id])return;seen[a.id]=1;(kids[a.id]||[]).forEach(mark)}
  roots.forEach(mark);
  list.forEach(function(a){if(!seen[a.id]){roots.push(a);mark(a)}});
  roots.sort(sortAg);Object.keys(kids).forEach(function(k){kids[k].sort(sortAg)});
  return {roots:roots,kids:kids};
}
function passF(a){
  if(S.flt==='attention'&&!attention(a))return false;
  if(S.flt==='active'&&a.status!=='active')return false;
  if(S.flt==='draft'&&a.status!=='draft')return false;
  var q=S.q.trim().toLowerCase();
  if(q){
    var h=[a.name,a.role,a.reportsTo,a.purpose].concat((a.todos||[]).map(function(t){return t.text})).concat((a.goals||[]).map(function(g){return g.text})).join(' ').toLowerCase();
    if(h.indexOf(q)<0)return false;
  }
  return true;
}

function todosCards(list){

function saveExt(E){S.ext=E;persist('meta','ext',E)}
function teamIndex(){var T=buildTree(S.agents),m={};T.roots.forEach(function(r){(function w(a){m[a.id]=r.name;(T.kids[a.id]||[]).forEach(w)})(r)});return m}
function allTeams(){var T=buildTree(S.agents),o=[];T.roots.forEach(function(r){if(o.indexOf(r.name)<0)o.push(r.name)});return o.sort()}
function applies(sc,a,tm){
  sc=sc||{mode:'all'};
  if(sc.mode==='all')return true;
  if(sc.mode==='project')return (sc.projects||[]).indexOf(a.projectId)>=0;
  if(sc.mode==='team')return (sc.teams||[]).indexOf(tm[a.id])>=0;

function appliedTo(a){var E=ext(),tm=teamIndex();return {rules:E.rules.filter(function(r){return applies(r.scope,a,tm)}),items:E.items.filter(function(x){return x.status!=='off'&&applies(x.scope,a,tm)})}}

  return h+'<div class="gc">'+E.items.map(function(x){return xCard(x,'item')}).join('')+'</div>';

function xCard(x,kind){

function openWizard(projectId){
  var pid=projectId||(S.scope!=='all'?S.scope:rid(S.repos[0]));
  S.wizard={step:1,projectId:pid,brief:(S.projects[pid]&&S.projects[pid].brief)||'',task:'',autonomy:'review',busy:false,error:'',fields:null,source:'template',ctl:null};

function toStep2(spec,source){
  var w=S.wizard;
  if(w.brief.trim()!==((S.projects[w.projectId]&&S.projects[w.projectId].brief)||'').trim())saveBrief(w.projectId,w.brief,true);
  w.fields=toFields(normalizeSpec(spec));w.source=source;w.step=2;w.error='';w.busy=false;w.ctl=null;render();
}
function wizTemplate(){
  var w=S.wizard;if(!w.task.trim()){w.error='Describe what the agent should do first.';render();return}
  toStep2(templateSpec(w),'template');
}
async function wizGenerate(){
  var w=S.wizard;if(!w.task.trim()){w.error='Describe what the agent should do first.';render();return}
  w.busy=true;w.error='';w.ctl=new AbortController();render();
  try{
    var spec=await SAMPLE.json(buildPrompt(w),{signal:w.ctl.signal,cache:false});
    if(S.wizard!==w)return;
    if(!spec||typeof spec!=='object'||Array.isArray(spec))throw {code:'invalid_json'};
    toStep2(spec,'claude');
  }catch(e){
    if(S.wizard!==w)return;
    w.busy=false;w.ctl=null;
    var c=e&&e.code;
    if(c==='cancelled'){w.error=''}
    else if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'){S.sampleBlocked=true;w.error='Claude drafting is not available for this page. Use the template draft instead.'}
    else if(c==='rate_limited')w.error='Too many requests right now. Wait a minute and try again, or use the template draft.';
    else if(c==='invalid_json')w.error='Claude replied in a format this page could not read. Try again, or use the template draft.';
    else w.error='Claude could not draft the role. Try again, or use the template draft.';
    render();
  }
}
function createAgent(){
  var w=S.wizard,f=w.fields;
  if(!f.name.trim()||!f.role.trim()){w.error='Give the agent a name and a role.';render();return}
  var s=fromFields(f);
  var a={id:newId(),projectId:w.projectId,name:s.name,role:s.role,reportsTo:s.reportsTo,status:'active',task:w.task.trim(),autonomy:w.autonomy,
    purpose:s.purpose,responsibilities:s.responsibilities,requirements:s.requirements,tools:s.tools,goals:s.goals,kras:s.kras,kpis:s.kpis,todos:s.todos,source:w.source,createdAt:Date.now()};
  S.agents.unshift(a);persist('agents',a.id,a);
  S.wizard=null;S.scope=w.projectId;S.tab='agents';S.openAgent=a.id;render();toast('Agent created');
}
function saveBrief(id,text,quiet){
  var p=S.projects[id]||{};p.brief=text.trim();S.projects[id]=p;persist('projects',id,p);
  if(!quiet){render();toast('Brief saved')}
}
async function sync(){
  if(!MCP||S.syncing)return;
  S.syncing=true;render();
  try{
    var r=await MCP.callTool('Claude Code Remote','list_repos',{limit:100},{cache:false});
    var p=r&&r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}
    var repos=(p&&p.repos)||(Array.isArray(p)?p:[]);
    var items=repos.filter(function(x){return x&&x.full_name&&x.full_name.indexOf('/')>0}).map(function(x){return {full_name:x.full_name,url:x.url||('https://github.com/'+x.full_name),pushed_at:x.pushed_at||'',visibility:x.visibility||'private'}});
    if(!items.length)throw {code:'empty'};
    S.repos=items;S.syncedAt=Date.now();
    persist('meta','repos',{items:items,syncedAt:S.syncedAt});
    toast('Synced '+items.length+' repositories');
  }catch(e){
    var c=e&&e.code;
    toast(c==='needs_reauth'||c==='server_not_connected'?'GitHub is not connected for this account. Reconnect it in claude.ai Settings, then sync again.':c==='not_in_manifest'||c==='consent_required'?'Sync was not allowed for this page.':c==='empty'?'GitHub returned no repositories.':'Sync failed. Try again in a moment.');
  }
  S.syncing=false;render();
}

function recordsText(a){
  var L2=[],td=today();

  if((a.may||[]).length)L2.push('You may: '+a.may.join('; '));
  if((a.mustNot||[]).length)L2.push('You must not: '+a.mustNot.join('; '));

  (a.goals||[]).forEach(function(g,i){L2.push((i+1)+'. '+g.text+' | '+(g.done?'met':'not met')+(g.horizon?' | horizon '+g.horizon:'')+(g.due?' | due '+g.due+(isLate('goal',g)?' (overdue)':''):' | no due date')+(g.note?' | note: '+g.note:''))});
  if(!(a.goals||[]).length)L2.push('(none)');
  L2.push('Key result areas:');
  (a.kras||[]).forEach(function(k,i){L2.push((i+1)+'. '+k.area+' ('+k.weight+'%): '+k.outcome)});
  if(!(a.kras||[]).length)L2.push('(none defined)');
  L2.push('KPIs:');
  (a.kpis||[]).forEach(function(k,i){L2.push((i+1)+'. '+k.name+' | target '+(k.target==null||k.target===''?'not set':k.target+' '+(k.unit||''))+' | '+(k.dir==='down'?'lower is better':'higher is better')+' | '+(k.cadence||'')+' | current '+(k.current==null?'no reading':k.current)+(k.due?' | due '+k.due:' | no due date'))});
  if(!(a.kpis||[]).length)L2.push('(none)');

function agentBrief(a){

   +'- When asked why something is stalled, ground the answer in the records (status, blocked or needs-founder tags in the todo text, priority, missing due dates, missing KPI targets or readings) and in your role limits (what you must not do, who you hand off to, approvals you need). If you do not know, say so and say what you need.\n'
   +'- When asked for timelines, give specific dates (YYYY-MM-DD) after today, say what each depends on, and be honest about what cannot be done in time.\n'
   +'- Routines show only a planned cadence and a recorded next-run date, not proof that a run happened. Docs are known by title and path only; do not describe their contents.\n'
   +'- Do not invent tickets, numbers, people or events. Take complaints without defensiveness: say what you will change and by when.\n'
   +'- Keep replies under about 200 words unless asked for more. Use a short list only when covering several items.\n\n'

function chatTurns(a){

async function sendChat(text){
  var c=S.chat,a=chatAgent();text=String(text||'').trim();
  if(!c||!a||c.busy||!text)return;
  if(!SAMPLE||S.sampleBlocked){c.error='Chat needs Claude access, which is not available in this view.';render();return}
  var ch=S.chats[a.id]=S.chats[a.id]||{messages:[]};ch.messages=(ch.messages||[]).slice();
  ch.messages.push({role:'founder',text:text,ts:Date.now()});
  c.draft='';c.busy=true;c.partial='';c.error='';c.proposals=null;c.confirmClear=false;c.ctl=new AbortController();render();
  var ctl=c.ctl;
  try{
    var r=await SAMPLE(chatTurns(a),{cache:false,signal:ctl.signal,onText:function(u){
      c.partial=u.text;var el=document.getElementById('chat-stream');
      if(el){el.textContent=u.text;var lg=document.getElementById('chat-log');if(lg)lg.scrollTop=lg.scrollHeight}
    }});
    ch.messages.push({role:'agent',text:String(r.text).trim()+(r.truncated?'\n[reply cut short]':''),ts:Date.now()});
  }catch(e){
    var code=e&&e.code;
    if(e&&e.text&&String(e.text).trim()&&code!=='refused')ch.messages.push({role:'agent',text:String(e.text).trim()+'\n[interrupted]',ts:Date.now()});
    if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'){S.sampleBlocked=true;c.error='Claude access was declined or is unavailable, so the agent cannot reply.'}
    else if(code==='rate_limited')c.error='Too many requests right now. Wait a minute, then send again.';
    else if(code!=='cancelled')c.error='The agent could not reply. Send again in a moment.';
  }
  c.busy=false;c.partial='';c.ctl=null;

  if(S.chat===c)render();
}
async function captureChat(){
  var c=S.chat,a=chatAgent();if(!c||!a||c.busy||c.extracting||!SAMPLE)return;
  var msgs=((S.chats[a.id]||{}).messages||[]).slice(-16);
  c.extracting=true;c.error='';render();
  var tr=msgs.map(function(m){return (m.role==='agent'?'AGENT: ':'FOUNDER: ')+m.text}).join('\n\n');
  var prompt='Below are an agent\'s records (items are numbered from 1) and a conversation between the founder and the agent. Today is '+today()+'.\n\nRECORDS\n'+recordsText(a)+'\n\nCONVERSATION\n'+tr+'\n\n'
   +'List what the AGENT clearly committed to in this conversation. Reply with only a JSON array. Each element: {"kind":"todo" or "goal" or "kpi" or "routine" (routine: due is its next-run date) or "memory" (a lasting instruction the FOUNDER gave that the agent accepted; index null, due null, note = the instruction in under 160 characters),"index":<number from the records>,"due":"YYYY-MM-DD" or null,"status":"todo" or "doing" or "done" or null (todos only; only if the agent said it is in that state),"note":"under 140 characters: the reason or dependency, in the agent\'s words"}. Do not include anything the agent did not commit to. Use [] if there is nothing.';
  try{
    var arr=await SAMPLE.json(prompt,{cache:false});
    var ok=[];
    (Array.isArray(arr)?arr:[]).forEach(function(p){
      var kind=p&&p.kind;
      if(kind==='memory'){var mt=String(p.note||'').trim().slice(0,200);if(mt)ok.push({kind:'memory',index:-1,due:'',status:'',note:mt,state:'open'});return}
      var idx=Number(p&&p.index)-1,list=kind==='todo'?a.todos:kind==='goal'?a.goals:kind==='kpi'?a.kpis:kind==='routine'?a.routines:null;
      if(!list||!(idx>=0&&idx<list.length))return;
      var due=/^\d{4}-\d{2}-\d{2}$/.test(String(p.due||''))?p.due:'';
      var st=(kind==='todo'&&['todo','doing','done'].indexOf(p.status)>=0)?p.status:'';
      var note=String(p.note||'').slice(0,160);
      if(!due&&!st&&!note)return;
      ok.push({kind:kind,index:idx,due:due,status:st,note:note,state:'open'});
    });
    c.proposals=ok;
  }catch(e){
    c.error=(e&&e.code==='rate_limited')?'Too many requests right now. Try again in a minute.':'Could not read dates from the chat. Try again.';
  }
  c.extracting=false;if(S.chat===c)render();
}
function applyProp(i,quiet){
  var c=S.chat,a=chatAgent(),p=c&&c.proposals&&c.proposals[i];
  if(!a||!p||p.state!=='open')return;
  p.state='applied';
  if(p.kind==='memory'){(a.memory=a.memory||[]).push({text:p.note,at:today(),src:'chat'});if(!quiet){persist('agents',a.id,a);render()}return}
  var it=(p.kind==='todo'?a.todos:p.kind==='goal'?a.goals:p.kind==='routine'?a.routines:a.kpis)[p.index];
  if(it&&p.kind==='routine'){if(p.due)it.next=p.due;if(p.note)it.note=p.note}
  else if(it){if(p.due)it.due=p.due;if(p.status&&p.kind==='todo')it.status=p.status;if(p.note)it.note=p.note}
  if(!quiet){persist('agents',a.id,a);render()}
}

    var kind=t.dataset.set,f=t.dataset.f,i=Number(t.dataset.i),v=t.type==='checkbox'?t.checked:t.value;
    if(f==='current'||f==='target'){v=v===''?null:Number(v);if(v!==null&&!isFinite(v))v=null}
    mutate(t.dataset.id,function(a){
      var arr=kind==='goal'?a.goals:kind==='todo'?a.todos:kind==='routine'?a.routines:a.kpis;
      if(arr&&arr[i])arr[i][f]=v;
    });
  }
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Escape'){
    if(S.xe){S.xe=null;render()}
    else if(S.edit){S.edit=null;render()}
    else if(S.modelsOpen){S.modelsOpen=false;render()}
    else if(S.wizard){if(S.wizard.ctl)S.wizard.ctl.abort();S.wizard=null;render()}
    else if(S.chat)closeChat();
    else if(S.openAgent){S.openAgent=null;render()}
  }
  else if(e.key==='Enter'&&t.id&&t.id.indexOf('lib-')===0){var lb=document.querySelector('[data-act="lib-add"][data-key="'+t.id.split('-')[1]+'"]');if(lb)lb.click()}
  else if(e.key==='Enter'&&t.id==='todo-new'){var b=document.querySelector('[data-act="todo-add"]');if(b)b.click()}
  else if(e.key==='Enter'&&t.id==='goal-new'){var g=document.querySelector('[data-act="goal-add"]');if(g)g.click()}
  else if(e.key==='Enter'&&t.dataset&&t.dataset.newtodo){
    var v=t.value.trim();if(!v)return;e.preventDefault();
    mutate(t.dataset.newtodo,function(a){(a.todos=a.todos||[]).push({text:v,status:'todo',due:''})});
  }
  else if(e.key==='Enter'&&!e.shiftKey&&t.id==='chat-input'){e.preventDefault();if(S.chat)sendChat(S.chat.draft)}
});

/* ---------- boot ---------- */
render();
(async function(){
  var C=window.claude;
  if(!C||!C.use){S.loaded=true;S.banner='Saving is not available in this view. Changes will not be kept.';render();return}
  try{DB=await C.use('db')}catch(e){}
  try{SAMPLE=await C.use('sample')}catch(e){}
  try{MCP=await C.use('mcp')}catch(e){}
  try{DL=await C.use('downloads')}catch(e){}
  if(!DB){S.loaded=true;S.banner='Saving is not available in this view. Changes will not be kept.';render();return}
  DB.collection('agents').onSnapshot(function(snap){
    var next=snap.docs.map(function(d){var o=clone(d.data());o.id=d.id;return o}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
    var sig=JSON.stringify(next);
    S.loaded=true;
    if(sig===lastSig&&lastSig!=='')return;
    lastSig=sig;S.agents=next;if(!S.seeded&&next.length){S.seeded=true;buildTree(next).roots.forEach(function(r){S.open[r.id]=true})}render();
  },function(){S.loaded=true;S.banner='Could not load saved agents. Reload the page to try again.';render()});
  DB.collection('projects').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){m[d.id]=clone(d.data())});S.projects=m;
    if(!(document.activeElement&&document.activeElement.id==='brief-edit'))render();
  },function(){});
  DB.collection('chats').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){m[d.id]=clone(d.data())});
    if(S.chat&&(S.chat.busy||S.chat.extracting))return;
    S.chats=m;if(S.chat)render();
  },function(){});
  DB.doc('meta/ext').onSnapshot(function(d){S.ext=d.exists?clone(d.data()):null;render()},function(){});
  DB.doc('meta/models').onSnapshot(function(d){S.models=d.exists?clone(d.data()):null;render()},function(){});
  DB.doc('meta/report').onSnapshot(function(d){S.report=d.exists?clone(d.data()):null;render()},function(){});
  DB.doc('meta/repos').onSnapshot(function(d){
    if(d.exists){var v=d.data();if(v&&Array.isArray(v.items)&&v.items.length){S.repos=clone(v.items);S.syncedAt=v.syncedAt||null;render()}}
  },function(){});
  render();
})();
})();
</script>
